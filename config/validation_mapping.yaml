  dsm_anhedonia:
    symptoms:
    - interest_loss
    - pleasure_loss
    aggregate: max
  dsm_appetite_change:
    symptoms:
    - appetite_decrease
    - appetite_increase
    - weight_decrease
    - weight_increase
    aggregate: max
  dsm_sleep_issues:
    symptoms:
    - insomnia_early
    - insomnia_middle
    - insomnia_late
    - hypersomnia
    aggregate: max
    factor: Sleep disturbance
  dsm_psychomotor:
    symptoms:
    - agitation
    - retardation
    aggregate: max
  dsm_fatigue:
    symptoms:
    - fatigue
    - energy_loss
    aggregate: max
  dsm_worthlessness:
    symptoms:
    - worthlessness
    - guilt
    aggregate: max
