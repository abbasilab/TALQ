_reduced_protocol:
  note: 'Reduced on-device protocol (Apple-silicon laptop, llama.cpp): only the symptoms
    mapped above are scored, plus three pre-specified control symptoms for the IRF
    and LoST datasets that are not conceptually related to the labels (discriminant
    check). Severity uses its 20 criterion-A items. Factor-score validation (needs
    all 52 items) is not part of the reduced protocol.'
  controls:
    irf: &id001
    - insomnia_early
    - appetite_decrease
    - gi_dysfunction
    lost: *id001
    severity: []
