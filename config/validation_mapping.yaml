irf:
  tbe:
    symptoms:
    - loneliness
    - others_dislike
    - others_unfriendly
    - ip_sensitivity
    factor: Social strain
    direction: 1
  pbu:
    symptoms:
    - worthlessness
    - self_punishment
    - guilt
    - si
    inverse_symptoms:
    - feeling_needed
    factor: Negative self-reflection
    direction: 1
lost:
  low_self_esteem:
    symptoms:
    - worthlessness
    - self_dislike
    - self_criticalness
    - self_failure
    inverse_symptoms:
    - feeling_good
    factor: Negative self-reflection
    direction: 1
severity:
  severity:
    symptoms:
    - sadness
    - interest_loss
    - pleasure_loss
    - appetite_decrease
    - appetite_increase
    - weight_decrease
    - weight_increase
    - insomnia_early
    - insomnia_middle
    - insomnia_late
    - hypersomnia
    - agitation
    - retardation
    - fatigue
    - energy_loss
    - worthlessness
    - guilt
    - concentration_dysfunction
    - indiciciveness
    - si
    note: DSM-5 MDD criterion A items; composite = mean
    ordinal: true
